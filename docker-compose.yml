name: xai-iml-26

services:
  frontend:
    image: frontend:latest
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile
      target: base
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "pnpm install && pnpm run dev --host 0.0.0.0 --port 3000"
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    image: backend:latest
    restart: on-failure
    build:
      context: ./backend/
      dockerfile: ./Dockerfile
      target: base
    volumes:
      - ./backend/src:/usr/src/app
      - screenshots-data:/screenshots
      - ./notebook_artifacts/chat_logs:/tmp/chat_logs
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: #change url back
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - PROXY_BASE_URL=http://localhost:8080
      - SCREENSHOTS_DIR=/screenshots
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LOCAL_LLM_MODEL=gemma4-vision-mygpu
      - LOCAL_LLM_API_KEY=not-needed
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    
  microservice:
    image: microservice:latest
    build:
      context: ./microservice/
      dockerfile: ./Dockerfile
      target: base
    volumes:
      - ./microservice/src:/usr/src/app
    ports:
      - "8081:8081"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql # TODO take a look at this, maybe /data needed
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  screenshots-data:
