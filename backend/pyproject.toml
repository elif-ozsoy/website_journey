[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]
extend-exclude = ["src/**/__pycache__"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes errors, B: bugbear (real-bug patterns), UP: modernize
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    "B008",  # FastAPI uses Depends(...) in argument defaults by design
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
